[package]
name = "voice-typing"
version = "0.1.0"
edition = "2024"
description = "Local Parakeet voice typing for KDE Wayland"
license = "MIT"

[dependencies]
anyhow = "1"
ashpd = { version = "0.14", features = ["global_shortcuts", "tokio"] }
clap = { version = "4", features = ["derive"] }
cpal = { version = "0.18", features = ["pipewire"] }
ctrlc = "3"
futures-util = "0.3"
ksni = { version = "0.3", features = ["blocking"] }
libc = "0.2"
sherpa-onnx = "2.0.1"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
